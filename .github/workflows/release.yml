# Builds Sonara for Windows, macOS and Linux and publishes the installers as a GitHub Release.
# Runs when a version tag is pushed (git tag v2.0.2 && git push origin v2.0.2), or by hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64 --arm64
          - name: macOS
            os: macos-latest
            args: --mac --arm64 --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npx electron-vite build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No signing certificates: Windows and macOS builds are unsigned (macOS ad-hoc).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: sonara-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Sonara ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
